name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew

      - run: ./gradlew build
      - run: mkdir -p $RUNNER_TEMP/release && for f in build/libs/*.jar; do mv "$f" "$RUNNER_TEMP/release/$(basename "$f" .jar)-26.2.jar"; done

      - uses: actions/checkout@v4
        with:
          ref: '26.1.2'
          clean: true
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - run: for f in build/libs/*.jar; do mv "$f" "$RUNNER_TEMP/release/$(basename "$f" .jar)-26.1.2.jar"; done

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release/*.jar
          name: TrashAddons ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
